<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- EKSEKUSI REDIRECT INSTAN SEBELUM HALAMAN DIRENDER -->
    <script>
        (function() {
            // === PASTE LINK ADSTERRA DIRECT LINK KAMU DI SINI ===
            const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                let store = JSON.parse(localStorage.getItem('shopee_links') || '{}');
                const targetShopeeUrl = store[rCode];

                if (targetShopeeUrl) {
                    // 1. Langsung buka Direct Link Adsterra di Tab Baru
                    window.open(ADSTERRA_DIRECT_LINK, '_blank');

                    // 2. Langsung arahkan Tab Utama ke Shopee secara instan
                    window.location.replace(targetShopeeUrl);
                } else {
                    document.write(`
                        <div style="font-family: sans-serif; text-align: center; padding: 40px;">
                            <h2 style="color: #ef4444;">Link Tidak Ditemukan</h2>
                            <p style="color: #6b7280; font-size: 14px;">Data link ini tidak tersimpan di browser ini.</p>
                            <a href="${window.location.origin}" style="display: inline-block; margin-top: 15px; background: #1f2937; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 12px;">Ke Dashboard</a>
                        </div>
                    `);
                }
            }
        })();
    </script>

    <!-- DASHBOARD GENERATOR (Sembunyi otomatis saat pengalihan link) -->
    <div id="dashboard" class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border hidden">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateInstantLink()" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Pendek
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Pendek (Domain Sendiri):</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        // Tampilkan Dashboard HANYA jika TIDAK ADA parameter ?r=...
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        };

        function generateRandomId(length = 6) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // FUNGSI GENERATE LINK
        function generateInstantLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee terlebih dahulu!');
                return;
            }

            const shortId = generateRandomId(6);

            // Simpan link Shopee ke LocalStorage
            let store = JSON.parse(localStorage.getItem('shopee_links') || '{}');
            store[shortId] = shopeeInput;
            localStorage.setItem('shopee_links', JSON.stringify(store));

            // Buat URL hasil
            const baseUrl = window.location.origin + window.location.pathname;
            const finalShortUrl = `${baseUrl}?r=${shortId}`;

            document.getElementById('resultUrl').value = finalShortUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>
</body>
</html>
