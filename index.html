<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Link Generator - Smartlink Wrapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Affiliate Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Link Adsterra Direct Link</label>
                <input type="url" id="adsterraUrl" placeholder="https://www.highratedcpmgate.com/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button onclick="generateLink()" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Pembungkus
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Pembungkus:</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        function generateLink() {
            const shopee = document.getElementById('shopeeUrl').value.trim();
            const adsterra = document.getElementById('adsterraUrl').value.trim();

            if (!shopee || !adsterra) {
                alert('Harap isi kedua link terlebih dahulu!');
                return;
            }

            // Enkripsi URL ke Base64 agar rapi di parameter
            const payload = btoa(JSON.stringify({ s: shopee, a: adsterra }));
            
            // Domain otomatis mengikuti lokasi hosting Cloudflare kamu
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
            const finalLink = `${baseUrl}redirect.html?data=${encodeURIComponent(payload)}`;

            document.getElementById('resultUrl').value = finalLink;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>
</body>
</html>
