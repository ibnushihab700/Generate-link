<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator - Shopee Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <!-- 1 KOLOM INPUT -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateLink()" id="btnSubmit" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Pendek
            </button>
        </div>

        <!-- 1 KOLOM HASIL OUTPUT -->
        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Pendek:</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        async function generateLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee terlebih dahulu!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Membuat Link Pendek...";

            try {
                // Mengubah URL Shopee menjadi bentuk ringkas (TinyURL)
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(shopeeInput)}`);
                const shortUrl = await response.text();

                if (shortUrl && shortUrl.startsWith('http')) {
                    document.getElementById('resultUrl').value = shortUrl;
                } else {
                    document.getElementById('resultUrl').value = shopeeInput;
                }
            } catch (error) {
                // Jika jaringan/API terhambat, tampilkan link asli
                document.getElementById('resultUrl').value = shopeeInput;
            } finally {
                document.getElementById('resultBox').classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Generate Link Pendek";
            }
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>

</body>
</html>
