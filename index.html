<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Short Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- DASHBOARD GENERATOR -->
    <div id="dashboard" class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateSuperShortLink()" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Super Pendek
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Super Pendek (Domain Sendiri):</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <!-- HALAMAN REDIRECT (Sembunyi Otomatis) -->
    <div id="redirector" class="bg-white p-8 rounded-xl shadow-md text-center max-w-md w-full border hidden">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto mb-4"></div>
        <h2 class="text-xl font-semibold text-gray-800">Menghubungkan ke Shopee...</h2>
        <p class="text-gray-500 text-sm mt-2">Mohon tunggu sebentar, Anda sedang dialihkan.</p>
        
        <div class="mt-6">
            <a id="manualBtn" href="#" class="inline-block bg-orange-500 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-orange-600 transition">
                Klik di sini jika tidak beralih otomatis
            </a>
        </div>
    </div>

    <script>
        // === PASTE LINK ADSTERRA DIRECT LINK KAMU DI SINI ===
        const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

        // Fungsi membuat ID acak 6 karakter
        function generateRandomId(length = 6) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // FUNGSI GENERATE LINK
        function generateSuperShortLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee terlebih dahulu!');
                return;
            }

            // Buat ID unik 6 Karakter
            const shortId = generateRandomId(6);

            // Simpan link ke LocalStorage Browser
            let store = JSON.parse(localStorage.getItem('shopee_links') || '{}');
            store[shortId] = shopeeInput;
            localStorage.setItem('shopee_links', JSON.stringify(store));

            // Buat URL hasil super pendek
            const baseUrl = window.location.origin + window.location.pathname;
            const finalShortUrl = `${baseUrl}?r=${shortId}`;

            document.getElementById('resultUrl').value = finalShortUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }

        // LOGIKA REDIRECT SAAT LINK DIBUKA
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                // Tampilkan tampilan redirect, sembunyikan dashboard
                document.getElementById('dashboard').classList.add('hidden');
                document.getElementById('redirector').classList.remove('hidden');

                // Cari target link Shopee dari LocalStorage
                let store = JSON.parse(localStorage.getItem('shopee_links') || '{}');
                const targetShopeeUrl = store[rCode];

                if (targetShopeeUrl) {
                    document.getElementById('manualBtn').href = targetShopeeUrl;

                    // 1. Buka Direct Link Adsterra di Tab Baru
                    window.open(ADSTERRA_DIRECT_LINK, '_blank');

                    // 2. Tab utama pindah ke halaman Shopee Affiliate
                    setTimeout(() => {
                        window.location.href = targetShopeeUrl;
                    }, 1000);
                } else {
                    document.body.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-md text-center max-w-md w-full border">
                            <h2 class="text-lg font-bold text-red-500">Link Tidak Ditemukan / Kadaluarsa</h2>
                            <p class="text-sm text-gray-500 mt-2">Link ini dibuat di perangkat lain atau data browser telah dibersihkan.</p>
                            <a href="${window.location.origin}" class="inline-block mt-4 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm">Kembali ke Dashboard</a>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
