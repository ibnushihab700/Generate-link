<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // === PASTE ADSTERRA DIRECT LINK BELOW ===
        const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

        // URL-safe Base64 decoder
        function decodeUrl(str) {
            try {
                // Restore standard Base64 characters from URL-safe variants
                let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) {
                    base64 += '=';
                }
                return atob(base64);
            } catch (e) {
                return null;
            }
        }

        // Check for redirect query parameter before rendering body content
        (function processRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                const targetUrl = decodeUrl(rCode);

                if (targetUrl && (targetUrl.startsWith('http://') || targetUrl.startsWith('https://'))) {
                    // 1. Open Adsterra Direct Link in a new tab
                    try {
                        window.open(ADSTERRA_DIRECT_LINK, '_blank');
                    } catch (err) {
                        console.error('Pop-up execution blocked or failed:', err);
                    }

                    // 2. Immediately replace current tab location with target Shopee URL
                    window.location.replace(targetUrl);
                }
            }
        })();
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div id="dashboard" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100 hidden">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Shopee Link Generator</h1>
            <p class="text-xs text-gray-500 mt-1">Buat link pembungkus Adsterra dengan domain sendiri</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label for="shopeeUrl" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">
                    Link Shopee Affiliate
                </label>
                <input 
                    type="url" 
                    id="shopeeUrl" 
                    placeholder="https://s.shopee.co.id/..." 
                    class="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-sm transition"
                    required
                >
            </div>

            <button 
                onclick="generateShortLink()" 
                id="btnGenerate"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3.5 rounded-xl transition shadow-sm hover:shadow active:scale-[0.99]"
            >
                Generate Link Pendek
            </button>
        </div>

        <!-- Result Output Container -->
        <div id="resultBox" class="mt-6 pt-6 border-t border-gray-100 hidden">
            <label for="resultUrl" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">
                Hasil Link (Domain Sendiri):
            </label>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="resultUrl" 
                    readonly 
                    class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-xs font-mono text-gray-700 focus:outline-none"
                >
                <button 
                    onclick="copyToClipboard()" 
                    class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-3 rounded-xl transition text-xs font-semibold shrink-0 active:scale-95"
                >
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-emerald-600 mt-2 font-medium hidden flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Link berhasil disalin ke clipboard!
            </p>
        </div>
    </div>

    <script>
        // Ensure dashboard is only rendered if no redirect parameter (?r=) is present
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        });

        // URL-safe Base64 encoder (removes padding & replaces non-URL safe chars)
        function encodeUrl(str) {
            try {
                return btoa(str)
                    .replace(/=/g, '')
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_');
            } catch (e) {
                return null;
            }
        }

        // Main Link Generation Function
        function generateShortLink() {
            const inputField = document.getElementById('shopeeUrl');
            const shopeeInput = inputField.value.trim();

            if (!shopeeInput) {
                alert('Harap masukkan URL Shopee terlebih dahulu!');
                return;
            }

            if (!shopeeInput.startsWith('http://') && !shopeeInput.startsWith('https://')) {
                alert('Harap masukkan URL yang valid (diawali dengan http:// atau https://)');
                return;
            }

            const encodedCode = encodeUrl(shopeeInput);
            if (!encodedCode) {
                alert('Gagal memproses URL.');
                return;
            }

            // Build output URL using current origin + pathname
            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?r=${encodedCode}`;

            document.getElementById('resultUrl').value = finalUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        // Robust Copy to Clipboard function
        function copyToClipboard() {
            const resultInput = document.getElementById('resultUrl');
            if (!resultInput.value) return;

            resultInput.select();
            resultInput.setSelectionRange(0, 99999); // Mobile support

            try {
                document.execCommand('copy');
            } catch (err) {
                navigator.clipboard.writeText(resultInput.value);
            }

            const notice = document.getElementById('copyNotice');
            notice.classList.remove('hidden');
            setTimeout(() => {
                notice.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
