<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- EKSEKUSI REDIRECT INSTAN -->
    <script>
        (function() {
            // === PASTE LINK ADSTERRA DIRECT LINK KAMU DI SINI ===
            const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                // Dekode link Shopee yang sudah dipendekkan
                const targetShopeeUrl = "https://tinyurl.com/" + rCode;

                // 1. Buka Adsterra di Tab Baru
                window.open(ADSTERRA_DIRECT_LINK, '_blank');

                // 2. Arahkan Tab Utama ke Shopee
                window.location.replace(targetShopeeUrl);
            }
        })();
    </script>

    <!-- DASHBOARD GENERATOR -->
    <div id="dashboard" class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border hidden">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateShortLink()" id="btnSubmit" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Pendek
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Pendek (Bisa Dibuka di Semua HP):</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        // Tampilkan Dashboard hanya jika tidak ada parameter ?r=...
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        };

        // FUNGSI GENERATE LINK
        async function generateShortLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee terlebih dahulu!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Memproses...";

            try {
                // Meminta kode pendek dari API TinyURL
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(shopeeInput)}`);
                const fullShortUrl = await response.text();

                if (fullShortUrl && fullShortUrl.startsWith('http')) {
                    // Ambil ID uniknya saja di bagian akhir (contoh: '2p8xY9z')
                    const shortCode = fullShortUrl.split('/').pop();
                    
                    // Gabungkan dengan domain milikmu
                    const baseUrl = window.location.origin + window.location.pathname;
                    document.getElementById('resultUrl').value = `${baseUrl}?r=${shortCode}`;
                } else {
                    alert('Gagal memproses link, silakan coba lagi.');
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan/API.');
            } finally {
                document.getElementById('resultBox').classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Generate Link Pendek";
            }
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>
</body>
</html>
