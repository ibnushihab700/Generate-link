<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LZ-String Library for maximal client-side compression without external backend APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <script>
        // === PASTE ADSTERRA DIRECT LINK BELOW ===
        const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

        // Base62 Alphabet dictionary for URL-safe short strings
        const B62_ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

        // Compress and encode Shopee URL to ultra-short parameter string
        function compressAndShorten(url) {
            try {
                // Strip common Shopee prefix if possible to optimize length
                let cleanUrl = url;
                let prefixIndex = -1;
                if (cleanUrl.startsWith('https://s.shopee.co.id/')) {
                    cleanUrl = cleanUrl.replace('https://s.shopee.co.id/', '');
                    prefixIndex = 1;
                } else if (cleanUrl.startsWith('https://shope.ee/')) {
                    cleanUrl = cleanUrl.replace('https://shope.ee/', '');
                    prefixIndex = 2;
                } else if (cleanUrl.startsWith('https://')) {
                    cleanUrl = cleanUrl.replace('https://', '');
                    prefixIndex = 3;
                }

                // Compress using LZ-String uint8 array
                const compressedBytes = LZString.compressToUint8Array(cleanUrl);
                
                // Convert compressed bytes into Base62 string
                let hexStr = '';
                for (let i = 0; i < compressedBytes.length; i++) {
                    hexStr += compressedBytes[i].toString(16).padStart(2, '0');
                }
                
                let num = BigInt('0x' + hexStr);
                let b62 = '';
                while (num > 0n) {
                    b62 = B62_ALPHABET[Number(num % 62n)] + b62;
                    num = num / 62n;
                }

                // Append prefix marker
                return (prefixIndex > 0 ? prefixIndex : 0) + b62;
            } catch (e) {
                // Fallback to URL-safe Base64 if compression fails
                return '0' + btoa(url).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            }
        }

        // Decompress and decode short parameter back into original Shopee URL
        function decompressAndExpand(code) {
            try {
                if (!code || code.length < 2) return null;
                const prefixType = code.charAt(0);
                const encodedData = code.slice(1);

                let decompressedUrl = '';

                if (prefixType === '0' && encodedData.length > 20) {
                    // Base64 fallback decompression
                    let base64 = encodedData.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    decompressedUrl = atob(base64);
                } else {
                    // Base62 + LZ-String decompression
                    let num = 0n;
                    for (let i = 0; i < encodedData.length; i++) {
                        const charIndex = B62_ALPHABET.indexOf(encodedData.charAt(i));
                        if (charIndex === -1) return null;
                        num = num * 62n + BigInt(charIndex);
                    }

                    let hexStr = num.toString(16);
                    if (hexStr.length % 2 !== 0) hexStr = '0' + hexStr;

                    const bytes = new Uint8Array(hexStr.length / 2);
                    for (let i = 0; i < hexStr.length; i += 2) {
                        bytes[i / 2] = parseInt(hexStr.substr(i, 2), 16);
                    }

                    decompressedUrl = LZString.decompressFromUint8Array(bytes);

                    // Reconstruct full URL from prefix marker
                    if (prefixType === '1') decompressedUrl = 'https://s.shopee.co.id/' + decompressedUrl;
                    else if (prefixType === '2') decompressedUrl = 'https://shope.ee/' + decompressedUrl;
                    else if (prefixType === '3') decompressedUrl = 'https://' + decompressedUrl;
                }

                return (decompressedUrl && decompressedUrl.startsWith('http')) ? decompressedUrl : null;
            } catch (e) {
                return null;
            }
        }

        // Execute instant silent redirection BEFORE body rendering to prevent flicker
        (function processRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                const targetUrl = decompressAndExpand(rCode);

                if (targetUrl) {
                    // 1. Open Adsterra Direct Link in a new tab
                    try {
                        window.open(ADSTERRA_DIRECT_LINK, '_blank');
                    } catch (err) {
                        console.error('Pop-up execution blocked:', err);
                    }

                    // 2. Instantly replace current tab location with full Shopee target
                    window.location.replace(targetUrl);
                }
            }
        })();
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div id="dashboard" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100 hidden">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Shopee Link Generator</h1>
            <p class="text-xs text-gray-500 mt-1">Shortener link domain sendiri + Adsterra Popup (Tanpa API/KV)</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label for="shopeeUrl" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">
                    Link Shopee Affiliate
                </label>
                <input 
                    type="url" 
                    id="shopeeUrl" 
                    placeholder="https://s.shopee.co.id/..." 
                    class="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-sm transition"
                    required
                >
            </div>

            <button 
                onclick="generateShortLink()" 
                id="btnGenerate"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3.5 rounded-xl transition shadow-sm hover:shadow active:scale-[0.99]"
            >
                Generate Link Pendek
            </button>
        </div>

        <!-- Result Output Box -->
        <div id="resultBox" class="mt-6 pt-6 border-t border-gray-100 hidden">
            <label for="resultUrl" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">
                Hasil Link (Domain Sendiri - Super Pendek):
            </label>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="resultUrl" 
                    readonly 
                    class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-xs font-mono text-gray-700 focus:outline-none"
                >
                <button 
                    onclick="copyToClipboard()" 
                    class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-3 rounded-xl transition text-xs font-semibold shrink-0 active:scale-95"
                >
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-emerald-600 mt-2 font-medium hidden flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Link berhasil disalin!
            </p>
        </div>
    </div>

    <script>
        // Show dashboard only when accessing standard page without redirect query parameter
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        });

        // Generate action triggered from UI button
        function generateShortLink() {
            const inputField = document.getElementById('shopeeUrl');
            const shopeeInput = inputField.value.trim();

            if (!shopeeInput) {
                alert('Harap masukkan URL Shopee terlebih dahulu!');
                return;
            }

            if (!shopeeInput.startsWith('http://') && !shopeeInput.startsWith('https://')) {
                alert('Harap masukkan URL yang valid (diawali dengan http:// atau https://)');
                return;
            }

            const shortCode = compressAndShorten(shopeeInput);
            if (!shortCode) {
                alert('Gagal memproses URL.');
                return;
            }

            // Build output URL using current domain + short parameter
            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?r=${shortCode}`;

            document.getElementById('resultUrl').value = finalUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        // Copy generated link to clipboard
        function copyToClipboard() {
            const resultInput = document.getElementById('resultUrl');
            if (!resultInput.value) return;

            resultInput.select();
            resultInput.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
            } catch (err) {
                navigator.clipboard.writeText(resultInput.value);
            }

            const notice = document.getElementById('copyNotice');
            notice.classList.remove('hidden');
            setTimeout(() => {
                notice.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
