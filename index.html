<script>
    function generateLink() {
        const shopee = document.getElementById('shopeeUrl').value.trim();

        if (!shopee) {
            alert('Harap masukkan link Shopee terlebih dahulu!');
            return;
        }

        const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
        
        // Menggunakan parameter 'to' langsung tanpa enkripsi Base64 yang panjang
        const finalLink = `${baseUrl}go.html?to=${encodeURIComponent(shopee)}`;

        document.getElementById('resultUrl').value = finalLink;
        document.getElementById('resultBox').classList.remove('hidden');
    }
</script>
