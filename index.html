<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // === KONFIGURASI ADSTERRA DIRECT LINK ===
        const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

        // EKSEKUSI REDIRECT INSTAN SAAT LINK DIBUKA DI HP/LAPTOP MANAPUN
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                try {
                    // Ambil URL tujuan dari Cloudflare KV
                    const res = await fetch(`/api/link?r=${rCode}`);
                    const data = await res.json();

                    if (data.targetUrl) {
                        // 1. Buka Adsterra di Tab Baru
                        window.open(ADSTERRA_DIRECT_LINK, '_blank');

                        // 2. Alihkan Tab Utama ke Shopee secara instan
                        window.location.replace(data.targetUrl);
                    }
                } catch (e) {
                    console.error("Gagal melakukan pengalihan");
                }
            }
        })();
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- DASHBOARD GENERATOR -->
    <div id="dashboard" class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border hidden">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateSuperShortLink()" id="btnSubmit" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Super Pendek
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link (Super Pendek & Universal):</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        };

        async function generateSuperShortLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Memproses...";

            try {
                const res = await fetch('/api/link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: shopeeInput })
                });

                const data = await res.json();

                if (data.shortId) {
                    const baseUrl = window.location.origin + window.location.pathname;
                    // Hasilnya cuma 3-4 karakter di belakang ?r=
                    const finalShortUrl = `${baseUrl}?r=${data.shortId}`;

                    document.getElementById('resultUrl').value = finalShortUrl;
                    document.getElementById('resultBox').classList.remove('hidden');
                } else {
                    alert('Gagal membuat link.');
                }
            } catch (e) {
                alert('Terjadi kesalahan sistem.');
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Link Super Pendek";
            }
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>
</body>
</html>
