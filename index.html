<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // === KONFIGURASI ADSTERRA DIRECT LINK ===
        const ADSTERRA_DIRECT_LINK = "https://www.highratedcpmgate.com/ganti-dengan-link-adsterra-mu";

        // EKSEKUSI REDIRECT INSTAN KETIKA LINK DIBUKA
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('r');

            if (rCode) {
                let targetShopeeUrl = "";

                // Rekonstruksi link Shopee dari kode pendek
                if (rCode.startsWith('http://') || rCode.startsWith('https://')) {
                    targetShopeeUrl = rCode;
                } else if (rCode.startsWith('s_')) {
                    targetShopeeUrl = "https://s.shopee.co.id/" + rCode.substring(2);
                } else if (rCode.startsWith('e_')) {
                    targetShopeeUrl = "https://shope.ee/" + rCode.substring(2);
                } else {
                    try {
                        let decoded = atob(rCode.replace(/-/g, '+').replace(/_/g, '/'));
                        targetShopeeUrl = decoded;
                    } catch (e) {
                        targetShopeeUrl = "https://s.shopee.co.id/" + rCode;
                    }
                }

                if (targetShopeeUrl) {
                    // 1. Langsung buka Direct Link Adsterra di Tab Baru
                    window.open(ADSTERRA_DIRECT_LINK, '_blank');

                    // 2. Langsung arahkan Tab Utama ke Shopee
                    window.location.replace(targetShopeeUrl);
                }
            }
        })();
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- DASHBOARD GENERATOR -->
    <div id="dashboard" class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg border hidden">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Shopee Link Generator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Link Shopee Affiliate</label>
                <input type="url" id="shopeeUrl" placeholder="https://s.shopee.co.id/..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button onclick="generateShortLink()" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-lg hover:bg-orange-600 transition">
                Generate Link Pendek
            </button>
        </div>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasil Link Pendek (Domain Sendiri):</label>
            <div class="flex gap-2">
                <input type="text" id="resultUrl" readonly class="w-full p-3 border rounded-lg bg-gray-50 text-sm font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm">
                    Salin
                </button>
            </div>
            <p id="copyNotice" class="text-xs text-green-600 mt-1 hidden">✓ Link berhasil disalin!</p>
        </div>
    </div>

    <script>
        // Tampilkan Dashboard HANYA jika TIDAK ADA parameter ?r=...
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('r')) {
                document.getElementById('dashboard').classList.remove('hidden');
            }
        };

        // FUNGSI GENERATE LINK SUPER PENDEK NATIVE
        function generateShortLink() {
            const shopeeInput = document.getElementById('shopeeUrl').value.trim();

            if (!shopeeInput) {
                alert('Harap masukkan link Shopee terlebih dahulu!');
                return;
            }

            let shortCode = "";

            // Otomatis mengekstrak ID unik Shopee agar hasil link sangat pendek
            if (shopeeInput.includes('s.shopee.co.id/')) {
                const parts = shopeeInput.split('s.shopee.co.id/');
                shortCode = "s_" + parts[1].split('?')[0].replace(/\//g, '');
            } else if (shopeeInput.includes('shope.ee/')) {
                const parts = shopeeInput.split('shope.ee/');
                shortCode = "e_" + parts[1].split('?')[0].replace(/\//g, '');
            } else {
                // Fallback enkripsi Base64 ringkas jika format link Shopee berbeda
                shortCode = btoa(shopeeInput).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            }

            // Buat URL hasil akhir
            const baseUrl = window.location.origin + window.location.pathname;
            const finalShortUrl = `${baseUrl}?r=${shortCode}`;

            document.getElementById('resultUrl').value = finalShortUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const notice = document.getElementById("copyNotice");
            notice.classList.remove("hidden");
            setTimeout(() => notice.classList.add("hidden"), 2000);
        }
    </script>
</body>
</html>
